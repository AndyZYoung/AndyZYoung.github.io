<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ca-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 z" fill="#7f8aa3" />
    </marker>
    <style>
      .ca-box { fill: none; stroke: #7f8aa3; stroke-width: 1.4; rx: 12; }
      .ca-fill { fill: rgba(127,138,163,0.08); stroke: #7f8aa3; stroke-width: 1.4; }
      .ca-t { fill: #9aa3ba; font-size: 14px; font-weight: 600; }
      .ca-s { fill: #79839a; font-size: 11.5px; }
      .ca-line { stroke: #7f8aa3; stroke-width: 1.4; fill: none; marker-end: url(#ca-arrow); }
      .ca-accent { fill: #d98a4f; }
    </style>
  </defs>

  <rect x="40" y="30" width="200" height="64" rx="12" class="ca-fill" />
  <text x="140" y="58" text-anchor="middle" class="ca-t">Course Materials</text>
  <text x="140" y="78" text-anchor="middle" class="ca-s">lecture slides &amp; notes</text>

  <rect x="40" y="150" width="200" height="78" rx="12" class="ca-fill" />
  <text x="140" y="178" text-anchor="middle" class="ca-t">BGE Embeddings</text>
  <text x="140" y="198" text-anchor="middle" class="ca-s">+ Ollama / DeepSeek-R1</text>
  <text x="140" y="216" text-anchor="middle" class="ca-s">grounded retrieval</text>

  <rect x="400" y="150" width="200" height="78" rx="12" class="ca-fill" />
  <text x="500" y="178" text-anchor="middle" class="ca-t">LightRAG Graph</text>
  <text x="500" y="198" text-anchor="middle" class="ca-s">entity + relation</text>
  <text x="500" y="216" text-anchor="middle" class="ca-s">knowledge retrieval</text>

  <rect x="220" y="300" width="200" height="70" rx="12" class="ca-fill" />
  <text x="320" y="330" text-anchor="middle" class="ca-t">Grounded Answer</text>
  <text x="320" y="350" text-anchor="middle" class="ca-s">cited to the syllabus</text>

  <rect x="40" y="300" width="150" height="70" rx="12" class="ca-fill" />
  <text x="115" y="330" text-anchor="middle" class="ca-t">Vue 3 Portal</text>
  <text x="115" y="350" text-anchor="middle" class="ca-s">course UI</text>

  <rect x="450" y="300" width="150" height="70" rx="12" class="ca-fill" />
  <text x="525" y="326" text-anchor="middle" class="ca-t">Digital Human</text>
  <text x="525" y="345" text-anchor="middle" class="ca-s">Three.js + Azure</text>
  <text x="525" y="362" text-anchor="middle" class="ca-s">TTS</text>

  <path class="ca-line" d="M140 94 L140 148" />
  <path class="ca-line" d="M240 70 C 360 70, 500 80, 500 148" />
  <path class="ca-line" d="M140 228 L300 298" />
  <path class="ca-line" d="M500 228 L340 298" />
  <path class="ca-line" d="M220 335 L192 335" />
  <path class="ca-line" d="M420 335 L448 335" />
  <circle cx="320" cy="284" r="4" class="ca-accent" />
