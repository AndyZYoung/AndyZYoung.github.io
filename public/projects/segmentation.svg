<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="sg-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 z" fill="#7f8aa3" />
    </marker>
    <style>
      .sg-fill { fill: rgba(127,138,163,0.08); stroke: #7f8aa3; stroke-width: 1.4; }
      .sg-t { fill: #9aa3ba; font-size: 13.5px; font-weight: 600; }
      .sg-s { fill: #79839a; font-size: 11px; }
      .sg-line { stroke: #7f8aa3; stroke-width: 1.4; fill: none; marker-end: url(#sg-arrow); }
      .sg-accent { fill: #d98a4f; }
    </style>
  </defs>

  <rect x="30" y="40" width="170" height="70" rx="12" class="sg-fill" />
  <text x="115" y="70" text-anchor="middle" class="sg-t">JD.com Data</text>
  <text x="115" y="90" text-anchor="middle" class="sg-s">transactions, clicks, SKUs</text>

  <rect x="30" y="190" width="170" height="80" rx="12" class="sg-fill" />
  <text x="115" y="218" text-anchor="middle" class="sg-t">Feature Engineering</text>
  <text x="115" y="238" text-anchor="middle" class="sg-s">discount, price, attributes</text>
  <text x="115" y="255" text-anchor="middle" class="sg-s">min-max / z-score scaling</text>

  <rect x="235" y="190" width="170" height="80" rx="12" class="sg-fill" />
  <text x="320" y="214" text-anchor="middle" class="sg-t">SKU Classes</text>
  <text x="320" y="233" text-anchor="middle" class="sg-s">k-means vs quartile</text>
  <text x="320" y="250" text-anchor="middle" class="sg-s">luxury / value / bargain</text>

  <rect x="440" y="170" width="170" height="120" rx="12" class="sg-fill" />
  <text x="525" y="196" text-anchor="middle" class="sg-t">Models</text>
  <text x="525" y="218" text-anchor="middle" class="sg-s">Logistic Regression</text>
  <text x="525" y="236" text-anchor="middle" class="sg-s">Decision Tree</text>
  <text x="525" y="254" text-anchor="middle" class="sg-s">Random Forest</text>
  <text x="525" y="272" text-anchor="middle" class="sg-s">Stacking</text>

  <rect x="235" y="350" width="290" height="72" rx="12" class="sg-fill" />
  <text x="380" y="380" text-anchor="middle" class="sg-t">Preference Prediction</text>
  <text x="380" y="400" text-anchor="middle" class="sg-s">boundary-blurring + RFE / search tuning</text>

  <path class="sg-line" d="M115 110 L115 188" />
  <path class="sg-line" d="M200 230 L233 230" />
  <path class="sg-line" d="M405 230 L438 230" />
  <path class="sg-line" d="M525 290 L420 348" />
  <path class="sg-line" d="M320 270 L350 348" />
  <circle cx="380" cy="335" r="4" class="sg-accent" />
</svg>
